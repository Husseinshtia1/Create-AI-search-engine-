name: G97 Curlie External Validation Integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/g97-curlie-external-validation/**'
      - '.github/workflows/g97-curlie-integrity.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Figshare v5 metadata without downloading HTML
        run: |
          set -euxo pipefail
          mkdir -p experiments/g97-curlie-external-validation/out-integrity
          python - <<'PY' | tee experiments/g97-curlie-external-validation/out-integrity/figshare_files.tsv
          import json, urllib.request
          url='https://api.figshare.com/v2/articles/19406693/versions/5'
          with urllib.request.urlopen(url, timeout=60) as r:
              meta=json.load(r)
          print('name\tid\tsize_bytes\tmd5\tdownload_url')
          for f in sorted(meta.get('files',[]), key=lambda x:x.get('name','')):
              print(f"{f.get('name')}\t{f.get('id')}\t{f.get('size')}\t{f.get('supplied_md5') or f.get('computed_md5')}\t{f.get('download_url')}")
          PY
      - name: Verify required file names are present
        run: |
          set -euxo pipefail
          for f in test_uid.txt class_vector.json.gz html_content.json.gz curlie_filtered.csv.gz class_names.txt; do
            grep -q "^${f}[[:space:]]" experiments/g97-curlie-external-validation/out-integrity/figshare_files.tsv
          done
      - uses: actions/upload-artifact@v4
        with:
          name: g97-curlie-integrity-metadata
          path: experiments/g97-curlie-external-validation/out-integrity/
