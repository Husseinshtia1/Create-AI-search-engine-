[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g97-search"
version = "0.2.0"
description = "Historically constrained search-engine research framework and G97 Live Alpha runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Research code; see repository documentation"}
authors = [{name = "G97 Search Project"}]
dependencies = []

[project.scripts]
g97 = "g97.cli:main"
g97-live = "g97.live.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
