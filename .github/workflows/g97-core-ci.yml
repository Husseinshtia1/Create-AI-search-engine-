name: G97 Core CI

on:
  push:
    branches: [main]
    paths:
      - 'src/g97/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/g97-core-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/g97/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/g97-core-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: pytest -q
