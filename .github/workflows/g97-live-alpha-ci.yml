name: G97 Live Alpha CI

on:
  push:
    branches: [main]
    paths:
      - 'src/g97/live/**'
      - 'tests/test_live_alpha.py'
      - 'pyproject.toml'
      - '.github/workflows/g97-live-alpha-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/g97/live/**'
      - 'tests/test_live_alpha.py'
      - 'pyproject.toml'
      - '.github/workflows/g97-live-alpha-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Run Live Alpha tests
        run: pytest -q tests/test_live_alpha.py
      - name: Smoke CLI
        run: |
          tmpdir=$(mktemp -d)
          g97-live --data-dir "$tmpdir" status
