name: G97 Web v6 Anchor Rescue Development
on:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original full WebKB archive
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            https://www.cs.cmu.edu/afs/cs/project/theo-20/www/data/webkb-data.gtar.gz \
            -o /tmp/webkb-data.gtar.gz
          mkdir -p /tmp/webkb
          tar xzf /tmp/webkb-data.gtar.gz -C /tmp/webkb
      - name: Run external-description rescue test
        run: |
          set -euxo pipefail
          PAGE_TEXT=$(find /tmp/webkb -type d -name page-text | head -1)
          test -n "$PAGE_TEXT"
          ROOT=$(dirname "$PAGE_TEXT")
          echo "resolved_root=$ROOT"
          mkdir -p experiments/g97-webv6-anchor-rescue-dev/out
          python experiments/g97-webv6-anchor-rescue-dev/g97_webv6_rescue.py \
            --root "$ROOT" \
            --out experiments/g97-webv6-anchor-rescue-dev/out/rescue.tsv \
            | tee experiments/g97-webv6-anchor-rescue-dev/out/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: g97-webv6-anchor-rescue-dev-results
          path: experiments/g97-webv6-anchor-rescue-dev/out/
