name: G97 Web v6 Anchor Rescue Development
on:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original CMU WebKB ILP archive
        run: |
          set -euxo pipefail
          for i in 1 2 3 4; do
            curl -L --fail --retry 2 --retry-all-errors \
              https://www.cs.cmu.edu/~WebKB/ilp-data.tar \
              -o /tmp/ilp-data.tar && break || sleep 2
          done
          test -s /tmp/ilp-data.tar
          mkdir -p /tmp/ilp
          tar xf /tmp/ilp-data.tar -C /tmp/ilp
      - name: Run external-description rescue test
        run: |
          set -euxo pipefail
          mkdir -p experiments/g97-webv6-anchor-rescue-dev/out
          python experiments/g97-webv6-anchor-rescue-dev/g97_webv6_rescue.py \
            --root /tmp/ilp \
            --out experiments/g97-webv6-anchor-rescue-dev/out/rescue.tsv \
            | tee experiments/g97-webv6-anchor-rescue-dev/out/run.log
      - name: Run post-result complementarity diagnostic
        run: |
          set -euxo pipefail
          python experiments/g97-webv6-anchor-rescue-dev/g97_webv6_diagnostic.py \
            --root /tmp/ilp \
            --out experiments/g97-webv6-anchor-rescue-dev/out/diagnostic.tsv \
            | tee experiments/g97-webv6-anchor-rescue-dev/out/diagnostic.log
      - uses: actions/upload-artifact@v4
        with:
          name: g97-webv6-anchor-rescue-dev-results
          path: experiments/g97-webv6-anchor-rescue-dev/out/
